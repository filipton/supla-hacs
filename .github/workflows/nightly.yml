name: Nightly

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  INTEGRATION: supla_local
  KEEP: 5

jobs:
  nightly:
    name: Publish a dev build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          MANIFEST="custom_components/${INTEGRATION}/manifest.json"
          LATEST_TAG="$(git tag --sort=-v:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)"
          VERSION="$(python - "$MANIFEST" "${LATEST_TAG}" <<'PY'
          import datetime, json, re, sys

          def parts(text):
              """The leading MAJOR.MINOR.PATCH of a version, or nothing."""
              match = re.match(r"v?(\d+)\.(\d+)(?:\.(\d+))?$", text or "")
              return tuple(int(g or 0) for g in match.groups()) if match else (0, 0, 0)

          with open(sys.argv[1]) as handle:
              manifest_version = json.load(handle)["version"]

          major, minor, patch = max(parts(manifest_version), parts(sys.argv[2]))
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M")

          print(f"{major}.{minor}.{patch + 1}.dev{stamp}")
          PY
          )"
          python - "$MANIFEST" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path) as handle:
              manifest = json.load(handle)
          manifest["version"] = version
          with open(path, "w") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION (newest release: ${LATEST_TAG:-none})"

      - name: Build the zip
        run: |
          set -euo pipefail
          cd "custom_components/${INTEGRATION}"
          zip -r "${RUNNER_TEMP}/${INTEGRATION}.zip" . -x '*__pycache__*' '*.pyc'

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SUBJECT_LINE="$(printf '%s' "${SUBJECT}" | head -n 1)"
          NOTES="$(printf '%s\n\n%s\n\n%s\n' \
            "Automatic build of \`${GITHUB_SHA:0:7}\`: ${SUBJECT_LINE}" \
            "Not a supported release. Install it only if you want the newest code." \
            "Enable pre-release versions for this repository in HACS to see it.")"
          gh release create "${TAG}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes "${NOTES}" \
            "${RUNNER_TEMP}/${INTEGRATION}.zip"

      - name: Prune older dev builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$' \
            | sort -Vr \
            | tail -n "+$((KEEP + 1))" \
            | while read -r old; do
                echo "pruning ${old}"
                gh release delete "${old}" --yes --cleanup-tag
              done
